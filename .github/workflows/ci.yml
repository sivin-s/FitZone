name: FitZone CI Pipeline

on:
  push: 
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  
jobs:
  backend-checks:
    name: Backend CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Linter
        run: |
          cd backend
          npm run lint
        
      - name: Build Backend (ts compiler check)
        run: |
          cd backend
          npm run build
  
  frontend-checks:
    name: Frontend CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run Frontend Linter
        run: | 
          cd frontend
          npm run lint 
      
      - name: Build Frontend (ts compiler check)
        run: |
          cd frontend
          npm run build